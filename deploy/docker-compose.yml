# Two services, one image.
#   gateway — Telegram front door + cron scheduler. This is the always-on one.
#   webui   — local-only inspection UI. Bound to 127.0.0.1 deliberately.
#
# Start with:  docker compose up -d
# Supervised by systemd on the VM: see hermes-assistant.service.
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-assistant:0.19.0
    container_name: hermes-gateway
    restart: unless-stopped
    # Restored after being removed in e7f365b. That removal reasoned the file
    # was redundant because Hermes reads $HERMES_HOME/.env itself — true for
    # Hermes' OWN config, but NOT for variables the gateway reads via
    # os.getenv() in the authorization path (TELEGRAM_ALLOWED_USERS,
    # GATEWAY_ALLOW_ALL_USERS, ...). Those must be in the PROCESS environment,
    # which is what this provides.
    #
    # Consequence: the compose client must be able to read the file, so run
    # `sudo docker compose ...` (the systemd unit already runs as root).
    # Note also that `docker restart` does NOT re-read this — an env change
    # needs `docker compose up -d --force-recreate`.
    env_file:
      - ${HERMES_HOME:-/opt/hermes/data}/.env
    environment:
      HERMES_HOME: /data
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      # Hermes home on the VM's ext4 managed disk — real POSIX locking, WAL works.
      - ${HERMES_HOME:-/opt/hermes/data}:/data
      # The markdown brain, so the agent can read and write it directly.
      - ${BRAIN_REPO:-/opt/hermes/workspace/family-brain}:/workspace/family-brain
    command: ["hermes", "gateway", "run"]
    healthcheck:
      test: ["CMD", "hermes", "gateway", "status"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }   # disk guard, part one

  webui:
    image: hermes-assistant:0.19.0
    container_name: hermes-webui
    restart: unless-stopped
    depends_on: [gateway]
    env_file:
      - ${HERMES_HOME:-/opt/hermes/data}/.env
    environment:
      HERMES_HOME: /data
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ${HERMES_HOME:-/opt/hermes/data}:/data
      - ${BRAIN_REPO:-/opt/hermes/workspace/family-brain}:/workspace/family-brain
    # 127.0.0.1 ONLY. Reach it with:  ssh -L 9119:127.0.0.1:9119 <vm>
    # Never publish this port to the internet: it fronts an agent with mail,
    # calendar, drive and shell access.
    ports:
      - "127.0.0.1:9119:9119"
    # `hermes dashboard`, NOT `hermes serve`. serve is the headless JSON-RPC /
    # WebSocket backend for the desktop app and remote clients — its own help
    # says "Headless: it never opens a browser UI", and hitting it in a browser
    # returns:
    #   {"error":"Headless backend (hermes serve): web UI disabled —
    #             use `hermes dashboard` for the browser UI."}
    # dashboard is the browser UI: config, API keys, sessions, cron jobs.
    #
    # --no-open because there is no browser in the container to launch.
    # --skip-build because the package ships a prebuilt frontend
    # (hermes_cli/web_dist) and npm is not installed in this image.
    #
    # 0.0.0.0 is required for the host's 127.0.0.1:9119 mapping to reach it,
    # and Hermes treats that as a non-loopback bind, which ALWAYS requires an
    # auth provider — set dashboard.basic_auth on the VM. See config.yaml.
    command: ["hermes", "dashboard", "--host", "0.0.0.0", "--port", "9119", "--skip-build", "--no-open"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
