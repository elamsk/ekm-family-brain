# Two services, one image.
#   gateway — Telegram front door + cron scheduler. This is the always-on one.
#   webui   — local-only inspection UI. Bound to 127.0.0.1 deliberately.
#
# Start with:  docker compose up -d
# Supervised by systemd on the VM: see hermes-assistant.service.
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: hermes-assistant:0.19.0
    container_name: hermes-gateway
    restart: unless-stopped
    # NO env-file directive here, deliberately. Two reasons:
    #
    # 1. It is read by the docker compose CLIENT, as the invoking user.
    #    $HERMES_HOME/.env is mode 600 owned by the container user (uid 10001),
    #    so a non-root `docker compose up` fails with:
    #      open /opt/hermes/data/.env: permission denied
    #
    # 2. It is redundant. Hermes loads $HERMES_HOME/.env itself at startup
    #    (hermes_cli/env_loader.py: load_hermes_dotenv), and HERMES_HOME=/data
    #    is bind-mounted below, so the container reads the same file directly
    #    as uid 10001 - the only process that should ever see it.
    #
    # Dropping it also keeps secrets out of `docker inspect`, where those
    # values are visible to anyone in the docker group.
    environment:
      HERMES_HOME: /data
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      # Hermes home on the VM's ext4 managed disk — real POSIX locking, WAL works.
      - ${HERMES_HOME:-/opt/hermes/data}:/data
      # The markdown brain, so the agent can read and write it directly.
      - ${BRAIN_REPO:-/opt/hermes/workspace/family-brain}:/workspace/family-brain
    command: ["hermes", "gateway", "run"]
    healthcheck:
      test: ["CMD", "hermes", "gateway", "status"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }   # disk guard, part one

  webui:
    image: hermes-assistant:0.19.0
    container_name: hermes-webui
    restart: unless-stopped
    depends_on: [gateway]
    # Same reasoning as the gateway above - Hermes reads /data/.env itself.
    environment:
      HERMES_HOME: /data
      TZ: ${TZ:-America/Los_Angeles}
    volumes:
      - ${HERMES_HOME:-/opt/hermes/data}:/data
      - ${BRAIN_REPO:-/opt/hermes/workspace/family-brain}:/workspace/family-brain
    # 127.0.0.1 ONLY. Reach it with:  ssh -L 9119:127.0.0.1:9119 <vm>
    # Never publish this port to the internet: it fronts an agent with mail,
    # calendar, drive and shell access.
    ports:
      - "127.0.0.1:9119:9119"
    command: ["hermes", "serve", "--host", "0.0.0.0", "--port", "9119", "--skip-build"]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
